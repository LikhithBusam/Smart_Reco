services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartreco
      POSTGRES_PASSWORD: smartreco
      POSTGRES_DB: smartreco
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartreco"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://smartreco:smartreco@db:5432/smartreco
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_DIR: /data/chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data/chroma
      - ./app:/app/app
      - ./static:/app/static
      - ./templates:/app/templates
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
  chroma_data:
